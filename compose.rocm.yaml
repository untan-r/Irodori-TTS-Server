services:
  api:
    devices:
      - /dev/kfd
      - /dev/dri
    security_opt:
      - seccomp=unconfined
    cap_add:
      - SYS_PTRACE
    group_add:
      - "${IRODORI_VIDEO_GID:-44}"
      - "${IRODORI_RENDER_GID:-993}"
    ipc: host
    shm_size: 8g
    environment:
      IRODORI_MODEL_DEVICE: cuda
      IRODORI_MODEL_PRECISION: bf16
      IRODORI_CODEC_DEVICE: cpu
      IRODORI_CODEC_PRECISION: fp32
      PYTORCH_ROCM_ARCH: gfx1151
